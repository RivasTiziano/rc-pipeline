image: docker:24.0.5

services:
  - docker:24.0.5-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: 1

stages:
  - install
  - test
  - build
  - deploy

# Cache de node_modules para acelerar los jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .nx/cache

.nx-base:
  image: node:20-alpine
  before_script:
    - apk add --no-cache git
    - npm ci

install:
  extends: .nx-base
  stage: install
  script:
    - npm install
  only:
    - merge_requests
    - main

lint_and_test:
  extends: .nx-base
  stage: test
  script:
    - npx nx affected -t lint test --base=origin/main
  only:
    - merge_requests
    - main

build_backend:
  stage: build
  script:
    - docker build 
        --cache-from $CI_REGISTRY_IMAGE/backend:latest 
        -t $CI_REGISTRY_IMAGE/backend:latest 
        -f .devcontainer/php.Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/backend:latest
  only: [main]

build_frontend:
  stage: build
  script:
    - docker build 
        --cache-from $CI_REGISTRY_IMAGE/frontend:latest 
        -t $CI_REGISTRY_IMAGE/frontend:latest 
        -f .devcontainer/node.Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  only: [main]

deploy_staging:
  stage: deploy
  script:
    - echo "Desplegando a entorno de staging..."
    # Aquí iría el comando de SSH o el trigger para Kubernetes/Portainer
  environment:
    name: staging
  only:
    - main