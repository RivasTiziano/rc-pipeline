services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/node.Dockerfile
    volumes:
      - ..:/workspaces/rc-pipeline:cached
    command: sleep infinity
    network_mode: service:backend 

  backend:
    build:
      context: ..
      dockerfile: .devcontainer/php.Dockerfile
    volumes:
      - ..:/workspaces/rc-pipeline:cached
    working_dir: /workspaces/rc-pipeline/apps/backend/codeigniter4
    ports:
      - "8080:8080"
      - "4200:4200"
    command: sh -c "php spark serve --host 0.0.0.0 --port 8080 || sleep infinity"

  db-admin:
    image: adminer
    ports:
      - "8081:8080"
